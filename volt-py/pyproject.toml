[project]
name = "volt-py"
version = "0.6.14"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vokaerian", email = "vokaerian@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "certifi>=2025.1.31",
    "pyside6>=6.11.2",
    "pyyaml>=6.0",
]

[project.scripts]
volt-py = "volt_py:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
]
