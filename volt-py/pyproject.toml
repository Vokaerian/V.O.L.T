[project]
name = "volt-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vokaerian", email = "vokaerian@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.2",
    "steamworks",
]

[project.scripts]
volt-py = "volt_py:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
]

[tool.uv.sources]
steamworks = { git = "https://github.com/philippj/SteamworksPy" }
